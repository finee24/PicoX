# =============================================================================
# Picox backend — configurazione degli strumenti di sviluppo
# =============================================================================
# Un solo file per pytest, ruff e mypy: gli hook locali
# (.claude/settings.json) e la CI (.github/workflows/backend-tests.yml)
# invocano gli stessi comandi e leggono queste stesse regole. Un lint che passa
# in locale e fallisce in CI è peggio che non averlo.

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` è un package: rende importabile `tests.fake_supabase` senza dipendere
# da come pytest manipola sys.path.
pythonpath = ["."]
# Le funzioni async non hanno bisogno di `@pytest.mark.asyncio` una per una.
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle
    "F",     # pyflakes
    "W",     # warnings
    "I",     # isort — ordine degli import
    "UP",    # pyupgrade
    "B",     # bugbear
    "C4",    # comprehensions
    "SIM",   # semplificazioni
    "ASYNC", # errori tipici del codice async
    "BLE",   # blind except: nel backend ogni `except Exception` è motivato con noqa
    "RUF",
]
ignore = [
    # I messaggi d'errore di dominio sono in italiano e vanno letti dall'utente
    # finale: estrarli in costanti li allontanerebbe dal punto in cui contano.
    "EM101",
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
# Nei test le asserzioni sono lo strumento, non un residuo di debug; e conftest
# deve impostare l'ambiente prima degli import (E402).
"tests/*" = ["S101", "E402"]

[tool.mypy]
python_version = "3.11"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]

warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false

# Librerie senza type stub pubblicati: senza questa esenzione ogni import
# diventa un errore e il type check smette di dire qualcosa di utile sul
# *nostro* codice, che è ciò che vogliamo controllare.
[[tool.mypy.overrides]]
module = [
    "apify_client.*",
    "supabase.*",
    "postgrest.*",
    "google.genai.*",
]
ignore_missing_imports = true
